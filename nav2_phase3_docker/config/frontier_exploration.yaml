frontier_explorer:
  ros__parameters:

    # --------------- TOPICS --------------- #

    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: exploration_complete
    frontier_marker_scale: 0.20

    # --------------- QoS --------------- #

    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: true
    map_qos_autodetect_timeout_s: 8.0
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    # --------------- GENERAL --------------- #

    use_sim_time: true
    map_processing_rate_hz: 1.0
    autostart: true
    control_service_enabled: true
    completion_event_enabled: true
    escape_enabled: true

    # Return to the starting position once exploration completes
    return_to_start_on_complete: true

    # If all remaining frontier fragments are suppressed/unreachable, return to start
    all_frontiers_suppressed_behavior: return_to_start

    # --------------- MRTSP SOLVER --------------- #

    mrtsp_solver: dp
    dp_solver_candidate_limit: 15
    dp_planning_horizon: 10

    # --------------- MAP OPTIMIZATION --------------- #

    frontier_map_optimization_enabled: true
    occ_threshold: 65

    # Filter out tiny residual boundary/crevice fragments (< 35 cells ≈ 1.75m boundary).
    # Real unexplored rooms/doorways have 80-150+ cells. This ensures exploration terminates
    # cleanly once all actual open spaces are mapped.
    min_frontier_size_cells: 35

    sensor_effective_range_m: 1.5

    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1

    # --------------- NAVIGATION SAFETY --------------- #

    frontier_selection_min_distance: 0.5
    frontier_candidate_min_goal_distance_m: 0.5
    frontier_visit_tolerance: 0.40

    # --------------- GOAL BEHAVIOR --------------- #

    # Disabled: prevents mid-route cancellations while driving between rooms
    goal_preemption_enabled: false
    goal_skip_on_blocked_goal: true

    post_goal_settle_enabled: true
    post_goal_min_settle: 1.5

    # --------------- FRONTIER SUPPRESSION --------------- #

    frontier_suppression_enabled: true

    # Suppress after 4 failed/stalling attempts at the same frontier location
    frontier_suppression_attempt_threshold: 4

    # Localized suppression area (0.8m) so only the stuck point is suppressed,
    # without accidentally blocking adjacent doorways or rooms
    frontier_suppression_base_size_m: 0.8
    frontier_suppression_expansion_size_m: 0.3

    # Keep unreachable frontier areas suppressed for 5 minutes so the explorer
    # does not loop trying the same dead spot repeatedly
    frontier_suppression_timeout_s: 300.0
    frontier_suppression_no_progress_timeout_s: 25.0
    frontier_suppression_progress_epsilon_m: 0.25

    frontier_suppression_startup_grace_period_s: 15.0
    frontier_suppression_max_attempt_records: 256
    frontier_suppression_max_regions: 64