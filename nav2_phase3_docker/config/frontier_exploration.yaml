frontier_explorer:
  ros__parameters:

    # --------------- TOPICS --------------- #

    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: exploration_complete
    frontier_marker_scale: 0.20

    # --------------- QoS --------------- #

    # SLAM Toolbox publishes /map with transient_local durability on Humble
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1

    # Autodetect startup QoS to avoid mismatches
    map_qos_autodetect_on_startup: true
    map_qos_autodetect_timeout_s: 8.0

    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    # --------------- GENERAL --------------- #

    use_sim_time: true

    # 1.0 Hz: poll for new frontiers every 1 s.
    # 0.25 Hz was too slow: the robot kept re-selecting the same nearby
    # frontier because the pool never refreshed fast enough to reveal
    # better candidates further away. Docker Desktop can afford 1 Hz fine.
    map_processing_rate_hz: 1.0

    autostart: true

    # Expose /control_exploration service so ball_approach_manager can stop us
    control_service_enabled: true

    completion_event_enabled: true

    # Help the robot escape if the first frontier goal is inaccessible
    escape_enabled: true

    return_to_start_on_complete: false

    # --------------- MRTSP SOLVER --------------- #

    # Switched from greedy to dp. Greedy "only optimizes the next selected
    # edge... it can miss a better route when a slightly more expensive
    # first choice leads to a much better sequence afterward" (upstream
    # docs) - that's exactly the symptom in the logs: the same close,
    # frozen-size frontier (size=167, unchanged across 50+ dispatches) kept
    # winning over anything that would actually grow the map. DP evaluates
    # a bounded lookahead instead of only the immediate next hop.
    mrtsp_solver: dp
    dp_solver_candidate_limit: 15
    dp_planning_horizon: 10

    # --------------- MAP OPTIMIZATION --------------- #

    frontier_map_optimization_enabled: true

    # Was implicitly inheriting the node's built-in default of 50.
    # Upstream's own packaged config uses 60, which is more forgiving of
    # sparse/noisy SLAM occupancy right at the frontier boundary.
    occ_threshold: 25

    # Was implicitly inheriting the node's built-in default of 5 cells,
    # which lets small noise-sized frontier fragments near the robot
    # (sensor edge artifacts, thin unexplored slivers next to furniture)
    # remain eligible candidates and compete with real unexplored area.
    min_frontier_size_cells: 15

    # sensor_effective_range_m is SUBTRACTED from the MRTSP path-cost
    # distance term: d(Vi,Vj) = max(...) - r_s. At 1.5m (the node default),
    # any frontier within ~1.5m of the robot scores as very cheap/negative
    # cost regardless of how little new area it actually reveals, which
    # keeps outcompeting farther frontiers with far more informational
    # gain. Lowered so this bias only applies to genuinely in-range,
    # already-visible frontiers rather than most of the near field.
    sensor_effective_range_m: 0.5

    # --------------- GOAL BEHAVIOR --------------- #

    # RE-ENABLED: leaving this off was the main cause of the robot pacing
    # in a small bubble near spawn. Without preemption, the explorer commits
    # to whatever frontier reference it first dispatches and never
    # reconsiders it even as new, better frontiers get revealed further out.
    # The original thrashing (goals cancelled every ~3s) was a symptom of
    # map_processing_rate_hz being too slow relative to preemption's
    # re-evaluation cadence, not of preemption itself. Fixed here by raising
    # map_processing_rate_hz to 1.0 and adding an explicit minimum gap below.
    goal_preemption_enabled: true

    # Minimum gap between preemption re-evaluations. Confirmed parameter,
    # default is 2.0s per upstream config; raised slightly here as extra
    # insurance against the original cancel-every-3s thrash.
    goal_preemption_min_interval_s: 3.0

    # Skip a frontier goal if Nav2 reports it as permanently blocked
    goal_skip_on_blocked_goal: true

    # Give SLAM 3 s after each successful goal to incorporate new scans
    # before we select the next frontier.
    post_goal_settle_enabled: true
    post_goal_min_settle: 3.0