name: nav2-phase3

services:
  nav2:
    build:
      context: .
      dockerfile: Dockerfile
    image: nav2-phase3:humble
    container_name: nav2_phase3
    environment:
      ROS_DOMAIN_ID: 45
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      TURTLEBOT3_MODEL: waffle_pi
      NAV2_STARTUP_TIMEOUT: 300
      ROBOT_X: -2.0
      ROBOT_Y: -0.5
      # Ball placed in the kitchen area (~6 m from robot start).
      # Forces the robot to build a full multi-room map before detecting the ball.
      BALL_X: 4.0
      BALL_Y: 1.5
      DISPLAY: host.docker.internal:0.0
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    working_dir: /ws
    volumes:
      - ../nav2_phase3_ws:/ws
    command: ["bash", "/usr/local/bin/start_nav2_phase3.sh"]
    stdin_open: true
    tty: true
